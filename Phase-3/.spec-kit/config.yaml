# Spec-Kit Plus Configuration for Phase III
version: "1.0"
project:
  name: "Hackathon II - Phase III: Todo AI Chatbot"
  description: "AI-powered Todo application with conversational interface, MCP server, and OpenAI Agents SDK"
  version: "1.0.0"
  type: "ai-chatbot-application"

directories:
  specs:
    root: "./@specs"
    overview: "./@specs/overview.md"
    architecture: "./@specs/architecture.md"
    features: "./@specs/features"
    api: "./@specs/api"
    database: "./@specs/database"
    mcp: "./@specs/mcp"

lifecycle:
  stages:
    - "specify"
    - "plan"
    - "tasks"
    - "implement"

specifications:
  required_sections:
    - "overview"
    - "architecture"
    - "features"
    - "api"
    - "database"
    - "mcp"

validation:
  strict: true
  require_approvals: true
